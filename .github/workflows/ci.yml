name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  backend:
    name: Backend tests and Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node is preinstalled on the runner image; the backend has no dependencies of its own to install here.
      - name: Live snapshot tests
        working-directory: docker/live
        run: node --test

      - name: Replay and recorder tests
        working-directory: docker/replay
        run: node --test

      # Also proves every patch in docker/patches still applies to the pinned upstream commit.
      - name: Build Docker image
        run: docker build ./docker
