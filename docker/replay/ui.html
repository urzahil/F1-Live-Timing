<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Replay Control</title>
<link rel="icon" type="image/svg+xml" href="/replay/F1.svg">
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1c1c1e; --muted:#6e6e73; --line:#d8d8dc; --accent:#e10600; --ok:#1a8f3c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --card:#1d1d20; --text:#f2f2f4; --muted:#9a9aa2; --line:#33333a; --ok:#3ecf64; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  label { color:var(--muted); font-size:13px; }
  input, select, button { font:inherit; padding:7px 10px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  input[type=number] { width:80px; }
  input[type=password] { flex:1; min-width:160px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-weight:600; font-size:13px; }
  .pill.live { background:var(--ok); color:#fff; }
  .pill.replay { background:var(--accent); color:#fff; }
  .muted { color:var(--muted); font-size:13px; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:10px 0 4px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); width:0; }
  .rec { padding:10px 0; border-top:1px solid var(--line); }
  .rec:first-child { border-top:0; }
  .rec .title { font-weight:600; }
  #error { color:var(--accent); min-height:1.4em; }
</style>
</head>
<body>
<main>
  <h1>F1 Replay Control</h1>

  <div class="card">
    <div class="row">
      <label for="token">Token</label>
      <input id="token" type="password" autocomplete="off" placeholder="REPLAY_TOKEN">
      <button id="save">Connect</button>
    </div>
    <div id="error"></div>
  </div>

  <div class="card" id="statusCard">
    <div class="row"><span id="mode" class="pill live">LIVE</span><span id="what" class="muted"></span></div>
    <div id="playback" hidden>
      <div class="bar"><div id="progress"></div></div>
      <div class="muted" id="position"></div>
      <div class="row" style="margin-top:10px">
        <label for="liveSpeed">Speed</label>
        <input id="liveSpeed" type="number" min="0" max="100" step="0.1" value="1" title="0 pauses">
        <button id="applySpeed">Apply</button>
        <label for="liveLap">Lap</label>
        <input id="liveLap" type="number" min="1" step="1">
        <button id="jump">Jump</button>
        <button id="live" class="primary">Back to live</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:6px"><strong>Recordings</strong><span class="muted">latest per session type, plus the ones you keep</span></div>
    <div id="recordings"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const LABELS = { practice: 'Practice', qualifying: 'Qualifying', 'sprint-qualifying': 'Sprint Qualifying', race: 'Race', sprint: 'Sprint' };
let token = '';
let lastRecordings = '';
try { token = localStorage.getItem('replayToken') || ''; } catch (e) {}
$('token').value = token;

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(r).padStart(2, '0');
}

async function api(method, path, body) {
  const res = await fetch('/replay/api' + path, {
    method,
    headers: { 'x-replay-token': token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

async function run(action) {
  try { $('error').textContent = ''; await action(); await refresh(); }
  catch (e) { $('error').textContent = e.message; }
}

function renderStatus(s) {
  const replay = s.mode === 'replay';
  $('mode').textContent = replay ? 'REPLAY' : 'LIVE';
  $('mode').className = 'pill ' + (replay ? 'replay' : 'live');
  $('playback').hidden = !replay;
  if (!replay) { $('what').textContent = 'Serving live data'; return; }
  $('what').textContent = (LABELS[s.slot] || s.slot) + ' - ' + (s.meeting || '') + ' ' + (s.name || '') + (s.finished ? ' (finished)' : '');
  $('progress').style.width = Math.min(100, (s.positionMs / s.durationMs) * 100) + '%';
  const lap = s.lap !== null ? ' - lap ' + s.lap + (s.totalLaps ? '/' + s.totalLaps : '') : '';
  $('position').textContent = fmt(s.positionMs) + ' / ' + fmt(s.durationMs) + ' at ' + s.speed + 'x' + lap;
}

function renderRecordings(list) {
  const box = $('recordings');
  box.replaceChildren();
  if (!list.length) { box.textContent = 'Nothing recorded yet. Recordings are saved when a live session ends.'; box.className = 'muted'; return; }
  box.className = '';
  for (const r of list) {
    const row = document.createElement('div'); row.className = 'rec';
    const title = document.createElement('div'); title.className = 'title';
    title.textContent = (LABELS[r.slot] || r.slot) + ' - ' + (r.meeting || '') + ' ' + (r.name || '');
    const info = document.createElement('div'); info.className = 'muted';
    const laps = r.maxLap ? ' - laps ' + (r.partial ? r.firstLap + '-' : '') + r.maxLap + (r.totalLaps ? '/' + r.totalLaps : '') : '';
    info.textContent = new Date(r.startedAt).toLocaleString() + ' - ' + fmt(r.durationMs) + ' - ' + r.messages + ' messages' + laps + (r.partial ? ' - PARTIAL' : '');
    const keepLabel = document.createElement('label'); keepLabel.style.cursor = 'pointer';
    const keep = document.createElement('input'); keep.type = 'checkbox'; keep.checked = !!r.keep; 
    keep.title = r.id.startsWith('archive-') ? 'Untick to delete this recording' : 'Keep this recording when a newer session of this type is saved';
    keep.onchange = () => {
      if (!keep.checked && r.id.startsWith('archive-') && !confirm('Delete this kept recording?')) { keep.checked = true; return; }
      run(() => api('POST', '/keep', { id: r.id, keep: keep.checked }));
    };
    keepLabel.append(keep, ' Keep');
    title.append(' ', keepLabel);
    const controls = document.createElement('div'); controls.className = 'row'; controls.style.marginTop = '6px';
    const speed = document.createElement('input'); speed.type = 'number'; speed.min = '0'; speed.max = '100'; speed.step = '0.1'; speed.value = '1'; speed.title = 'Speed (0 pauses)';
    controls.append('Speed', speed);
    let lap = null;
    if (r.maxLap) {
      lap = document.createElement('input'); lap.type = 'number'; lap.min = '1'; lap.step = '1'; lap.placeholder = 'start';
      controls.append('From lap', lap);
    }
    const play = document.createElement('button'); play.className = 'primary'; play.textContent = 'Play';
    play.onclick = () => run(() => api('POST', '/start', { id: r.id, speed: Number(speed.value), lap: lap && lap.value ? Number(lap.value) : undefined }));
    controls.append(play);
    row.append(title, info, controls);
    box.append(row);
  }
}

async function refresh() {
  if (!token) return;
  const [s, r] = await Promise.all([api('GET', '/status'), api('GET', '/recordings')]);
  renderStatus(s);
  // The poll must not rebuild the list while a speed or lap field is being edited.
  const signature = JSON.stringify(r.recordings);
  if (signature !== lastRecordings) { lastRecordings = signature; renderRecordings(r.recordings); }
}

$('save').onclick = () => {
  token = $('token').value.trim();
  try { localStorage.setItem('replayToken', token); } catch (e) {}
  run(() => Promise.resolve());
};
$('applySpeed').onclick = () => run(() => api('POST', '/speed', { speed: Number($('liveSpeed').value) }));
$('jump').onclick = () => run(() => api('POST', '/jump', { lap: Number($('liveLap').value) }));
$('live').onclick = () => run(() => api('POST', '/live'));

run(() => Promise.resolve());
setInterval(() => { refresh().catch(() => {}); }, 2000);
</script>
</body>
</html>
